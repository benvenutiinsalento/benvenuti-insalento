<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segnala un evento | Benvenuti in Salento</title><link rel="stylesheet" href="styles/main.css"><link rel="stylesheet" href="styles/events.css"><script defer src="scripts/submit-event.js"></script></head><body><header class="event-mini-header"><a href="/"><img src="assets/images/benvenuti-in-salento-logo.png" alt="" width="46"><strong>Benvenuti in Salento</strong></a><nav><a href="eventi.html">Eventi</a><a href="/">Home</a></nav></header><main class="submission-shell"><section class="submission-card"><p class="eyebrow">Collaborazione territoriale</p><h1>Segnala un evento reale</h1><p>Invia una fonte ufficiale o dell’organizzatore. La segnalazione non viene pubblicata automaticamente: sarà controllata, normalizzata e confrontata con gli eventuali duplicati.</p><form id="submission-form"><div hidden><label>Non compilare<input name="website"></label></div><div class="submission-grid"><label>Nome evento *<input name="eventName" required maxlength="180"></label><label>Comune *<input name="town" required maxlength="100"></label><label>Data iniziale<input type="date" name="startDate"></label><label>Data finale<input type="date" name="endDate"></label><label>Organizzatore<input name="organizerName" maxlength="180"></label><label>Email di contatto<input type="email" name="contactEmail"></label></div><label>Fonte ufficiale o locandina pubblica<input type="url" name="sourceUrl" placeholder="https://..."></label><label>Informazioni utili<textarea name="notes" maxlength="3000" placeholder="Luogo, orario, programma, ingresso, contatti..."></textarea></label><label class="privacy-check"><input type="checkbox" name="privacyConsent" value="yes" required> Ho letto l’<a href="privacy.html" target="_blank">informativa privacy</a> e autorizzo il trattamento dei dati necessari alla verifica della segnalazione.</label><button class="button button-primary" type="submit">Invia per la verifica</button><p id="submission-status" aria-live="polite"></p></form></section></main></body></html>
