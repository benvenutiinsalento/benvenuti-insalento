# ============================================================================
# MANDATO — Manutenzione giornaliera: archivio storico, copertura, e
# RIGENERAZIONE QUOTIDIANA dell'archivio di riserva (fallback) da Supabase.
# Il commit risultante ripubblica automaticamente il sito su Netlify.
# ============================================================================
name: Manutenzione giornaliera + rigenerazione fallback

on:
  schedule:
    - cron: "30 3 * * *"     # ogni giorno 03:30 UTC (05:30 ora italiana estiva)
  workflow_dispatch: {}

permissions:
  contents: write            # necessario per committare i file rigenerati

concurrency:
  group: daily-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev
      - name: Manutenzione + rigenerazione fallback e report copertura
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/gha-maintenance.mjs
      - name: Commit file rigenerati (se cambiati)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rigenerazione giornaliera fallback + report copertura da Supabase"
          file_pattern: "data/verified-programs-2026.json data/coverage-report.json"
          commit_user_name: "salento-bot"
          commit_user_email: "bot@benvenutiinsalento.it"
