# ============================================================================
# CI — Controlli a ogni push: verifica progetto + test (58+).
# ============================================================================
name: Test e controlli

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev
      - run: npm run check
      - run: npm test
